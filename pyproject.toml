[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xiongkang", email = "xkang744@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "djlint>=1.44.2",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.4",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
fastapi-blog = "fastapi_blog:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
# Ruff replaces black (ruff format) + isort (import sorting).
# line-length 88 = black's default, so existing code stays unchanged.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E4/E7/E9 + F = ruff's default error checks; I = isort-style import
# sorting (stdlib -> third-party -> local, fixed via `ruff check --fix`).
select = ["E4", "E7", "E9", "F", "I"]

[tool.djlint]
# Jinja2 template formatter/linter — understands {% %} and {{ }} tags
# so HTML formatting no longer mangles template syntax.
profile = "jinja"
extension = "html"
indent = 4
max_line_length = 120
max_attribute_length = 70
format_attribute_template_tags = true

[dependency-groups]
dev = [
    "djlint>=1.44.2",
    "ruff>=0.16.4",
]
